[package]
name = "obfusku-lsp"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Language Server Protocol implementation for Obfusku — links obfusku-syntax and obfusku-typecheck directly."
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "obfusku-lsp"
path = "src/main.rs"

[dependencies]
obfusku-diagnostics = { version = "1.0.0", path = "../obfusku-diagnostics" }
obfusku-core = { version = "1.0.0", path = "../obfusku-core" }
obfusku-typecheck = { version = "1.0.0", path = "../obfusku-typecheck" }
obfusku-syntax = { version = "1.0.0", path = "../obfusku-syntax" }
obfusku-cli = { version = "1.0.0", path = "../obfusku-cli" }
lsp-server = "0.7"
lsp-types = "0.97"
serde_json = "1"
percent-encoding = "2"

[lints]
workspace = true
