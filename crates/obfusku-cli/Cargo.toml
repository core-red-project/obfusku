[package]
name = "obfusku-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Obfusku CLI — orchestration and presentation only, no language logic of its own."
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "obfusku"
path = "src/main.rs"

[dependencies]
obfusku-diagnostics = { path = "../obfusku-diagnostics" }
obfusku-core = { path = "../obfusku-core" }
obfusku-typecheck = { path = "../obfusku-typecheck" }
obfusku-syntax = { path = "../obfusku-syntax" }
obfusku-runtime = { path = "../obfusku-runtime" }
obfusku-fmt = { path = "../obfusku-fmt" }
toml = { version = "0.8", default-features = false, features = ["parse"] }

[lints]
workspace = true
