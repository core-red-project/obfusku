[package]
name = "obfusku-fmt"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Formatter over obfusku-syntax's surface AST. No dependency on obfusku-core, obfusku-typecheck, or obfusku-runtime."
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
obfusku-syntax = { version = "1.0.0", path = "../obfusku-syntax" }
obfusku-diagnostics = { version = "1.0.0", path = "../obfusku-diagnostics" }

[lints]
workspace = true

# Dev-only: the shipped library itself has no dependency on the
# typecheck/runtime stack (formatting ill-typed, in-progress code must
# keep working, per IMPLEMENTATION_ARCHITECTURE.md §13) — these exist
# only so tests/roundtrip.rs can prove reformatting preserves runtime
# *behavior*, not merely that the reformatted text re-parses.
[dev-dependencies]
obfusku-cli = { version = "1.0.0", path = "../obfusku-cli" }
obfusku-runtime = { version = "1.0.0", path = "../obfusku-runtime" }
